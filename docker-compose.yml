services:
  # 构建基础镜像（使用 docker compose build 构建）
  test-framework:
    build: .
    image: test-framework:latest
    command: ["--demo"]
    profiles: ["build"]

  # 测试框架 - 演示模式
  test-demo:
    image: test-framework:latest
    command: ["--demo"]

  # 测试框架 - 运行pytest测试
  test-pytest:
    image: test-framework:latest
    volumes:
      - ./backend/reports:/app/reports
    environment:
      - TEST_URL=${TEST_URL:-http://host.docker.internal:8080}
      - TEST_USERNAME=${TEST_USERNAME:-13800138000}
      - TEST_PASSWORD=${TEST_PASSWORD:-123456}
      - VERIFY_CODE=${VERIFY_CODE:-8888}
      - HEADLESS=true
      - SHOP_TYPE=${SHOP_TYPE:-tpshop}
    command: ["-m", "pytest", "tests/test_login.py", "-v", "--html=reports/test_report.html"]
    network_mode: host

  # 测试框架 - 运行DDT测试
  test-ddt:
    image: test-framework:latest
    volumes:
      - ./backend/reports:/app/reports
    environment:
      - TEST_URL=${TEST_URL:-http://host.docker.internal:8080}
      - TEST_USERNAME=${TEST_USERNAME:-13800138000}
      - TEST_PASSWORD=${TEST_PASSWORD:-123456}
      - VERIFY_CODE=${VERIFY_CODE:-8888}
      - HEADLESS=true
      - SHOP_TYPE=${SHOP_TYPE:-tpshop}
    command: ["-m", "pytest", "tests/test_login_ddt.py", "-v"]
    network_mode: host

  # 交互模式（进入容器调试）
  test-shell:
    image: test-framework:latest
    volumes:
      - ./backend/reports:/app/reports
      - ./backend/data:/app/data
    environment:
      - TEST_URL=${TEST_URL:-http://host.docker.internal:8080}
      - HEADLESS=true
    command: ["/bin/bash"]
    network_mode: host
    stdin_open: true
    tty: true

  # Selenium Grid 分布式测试（可选高级用法）
  selenium-chrome:
    image: selenium/standalone-chrome:latest
    container_name: selenium-chrome
    ports:
      - "4444:4444"
      - "7900:7900"
    shm_size: 2g
    environment:
      - SE_NODE_MAX_SESSIONS=5
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
      - SE_NODE_SESSION_TIMEOUT=120

  # 使用Selenium Grid的测试框架
  test-remote:
    image: test-framework:latest
    volumes:
      - ./backend/reports:/app/reports
    environment:
      - TEST_URL=${TEST_URL:-http://host.docker.internal:8080}
      - SELENIUM_REMOTE_URL=http://selenium-chrome:4444/wd/hub
      - HEADLESS=false
    depends_on:
      - selenium-chrome
    network_mode: host
